name: Flutter Nightly Build

on:
  # The nightly matrix is the upstream one and would spend the free Actions
  # minutes. Publish with .github/workflows/sda-release.yml instead.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
