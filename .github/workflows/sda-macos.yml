name: Smart Desktop Access macOS

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

# Disk images are workflow artifacts only. This does not publish a GitHub
# Release, so it does not move the stable "latest" release.

permissions:
  contents: read
  actions: write

jobs:
  client:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: macos-preview
      publish-update-metadata: false
      variant: client
      product-build: true
      macos-only: true
      publish-release: false

  admin:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: macos-preview
      publish-update-metadata: false
      variant: admin
      product-build: true
      macos-only: true
      publish-release: false
